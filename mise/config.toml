# Global tools, linked to ~/.config/mise/config.toml by setup.sh.
# Machine-specific overrides go in ~/.config/mise/conf.d/*.toml (untracked).
[tools]
# runtimes
node = "26"
ruby = "4.0"

# CLI tools (zsh / git / nvim / LazyVim depend on these)
neovim = "latest"      # apt's neovim is too old for LazyVim
fzf = "latest"
ripgrep = "latest"
fd = "latest"          # apt ships it as `fdfind`
lazygit = "latest"
delta = "latest"       # git core.pager — git log/diff break without it
gh = "latest"          # git credential helper
git-lfs = "latest"     # git lfs filter is `required = true`
tree-sitter = "latest" # nvim-treesitter needs the CLI to build parsers
jq = "latest"
